# 🌊 WkWave Live Daemon
name: "🌊 WkWave Live Daemon"

on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 min, ALL days incl weekends (365/24 feed-daemon relay; newest-wins overlap handoff via _active_run_id)
  workflow_dispatch:

permissions:
  contents: read

# NO concurrency block (2026-08-03, restored to the original design intent per
# cross-repo-gha-relay-pattern-public-feeder-drives-private-strategy step 6: "no
# concurrency group"). The scalper now has real baton-touch handoff (ported from
# wkwave_daemon.py's _claim/_active_run_id): a new run claims ownership via a GH
# Variable only AFTER its own setup completes, and the OLD run detects the
# supersession on its next tick and exits gracefully -- so overlapping runs are
# the intended coverage mechanism, not a race to prevent. A GHA concurrency group
# with cancel-in-progress=true would forcibly kill the old run the INSTANT a new
# one is queued (not once the new one is actually ready), which is worse than no
# group at all: it can kill a scalper process mid order-submission. The historical
# reason cancel-in-progress=true was added (2026-06-16: an unbounded hung daemon
# blocked every future run indefinitely) no longer applies -- the job itself has
# timeout-minutes: 32 as the hard backstop, so a stuck run can block at most 32
# minutes, never indefinitely.

env:
  GH_TOKEN:            ${{ secrets.GH_PAT }}
  HANTOO_APPKEY_KR:    ${{ secrets.HANTOO_APPKEY_KR }}
  HANTOO_APPSECRET_KR: ${{ secrets.HANTOO_APPSECRET_KR }}
  HANTOO_ACCOUNTNO_KR: ${{ secrets.HANTOO_ACCOUNTNO_KR }}
  SLACK_BOT_TOKEN:     ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL:       ${{ secrets.SLACK_CHANNEL }}
  PYTHONUTF8:          "1"
  PYTHONPATH:          "${{ github.workspace }}/wkaq/scripts"
  MAEJIP_RELAY_MODE:   "1"

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 32  # > the 20min relay cron so the old run survives to OVERLAP the new one and hand off cleanly ([>] via _active_run_id) instead of being CANCELLED at the timeout; > the 30min daemon relay-budget so [relay-exit] fires before GHA cancels

    steps:
      - name: mark start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: setup-python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: clone
        run: |
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/kiexpert/WkAutoQuant.git" \
            wkaq

      - name: install
        run: pip install -q -r wkaq/requirements.txt

      - name: restore token
        run: |
          mkdir -p ~/.wk-cache/hantoo
          [ -f wkaq/wavevault/hantoo_cache/hantoo_token_kr.json ] && \
            cp wkaq/wavevault/hantoo_cache/hantoo_token_kr.json ~/.wk-cache/hantoo/ || true
          # Dynamic-load the committed daily token into HANTOO_TOKEN_KR env so
          # get_token() (which checks that env FIRST) returns it instead of
          # issuing a NEW token every ~20min relay cycle (was dozens/day; owner
          # 2026-06-16 permitted the env-var approach -- faster than a per-run
          # token-cache commit, no merge conflicts). Load ONLY if not expired.
          TOK=$(python -c "import json,time; d=json.load(open('wkaq/wavevault/hantoo_cache/hantoo_token_kr.json')); print(d.get('access_token','') if time.time() < float(d.get('expires_at',0) or 0) else '')" 2>/dev/null || true)
          if [ -n "$TOK" ]; then
            echo "HANTOO_TOKEN_KR=$TOK" >> "$GITHUB_ENV"
            echo "[token] loaded committed daily token into HANTOO_TOKEN_KR env (no reissue)"
          else
            echo "[token] committed token missing/expired -- get_token will fall back"
          fi

      - name: run
        run: |
          HOUR=$(date -u +%H | sed 's/^0//')
          # LOOP-ENTRY TIME GATE REMOVED (2026-08-06, owner directive: "쓸데없는 루프진입
          # 시간제한 땜빵있으면 제거해주삼"). This block used to carry a THIRD branch --
          # "else echo '.'; exit 0" -- for the hours matching neither market. That branch
          # was the bandaid, and it was the whole bug the owner reported as "the feed
          # daemon is stuck in an infinite loop on a weird step": the run step fell into
          # it and exited in MILLISECONDS, then the self-chain step below slept out the
          # rest of its 20min window and re-dispatched, forever. Every cycle in that
          # window did zero work and only slept. From outside it is indistinguishable
          # from a hang, but nothing was hung -- there was simply no branch to run.
          #
          # There are now only TWO branches and they TILE ALL 24 HOURS, so no hour can
          # ever fall through to a dead exit again. KR takes 22..23 and 0..7 (07:00-17:00
          # KST, wrapping the 09:00-15:30 session with pre-open warmup and post-close
          # settle); US takes 8..21 (17:00-07:00 KST, wrapping the 22:30-05:00 KST
          # session the same way). The scalper is therefore ALWAYS looping, which is what
          # WkAutoQuant CLAUDE.md's 365/24 standing mission asks for and what
          # gha-relay-pattern-t3-security step 2 ("run the relay 7 days a week without a
          # weekday gate") already specified.
          #
          # Safe because out-of-session ticks cannot transact: orders outside market
          # hours are broker-rejected -- the exact property the weekend market-closed
          # rehearsal deliberately relies on -- and the scalper's own close-out windows
          # are separately time-gated (KR 15:17-15:20, US 05:57-06:00 KST). GHA cost does
          # not rise either: those hours were ALREADY burning a full 20min sleep per
          # cycle, so this replaces paid idling with paid working, and WkFeedQuant is a
          # public repo (unlimited free Actions minutes).
          #
          # DO NOT reintroduce a "market closed -> exit early" branch here. If the
          # scalper should be quiet at some hour, that belongs INSIDE the scalper where
          # it can be tested, not in workflow YAML where it silently becomes a dead zone.
          # KR HANDS OVER AT 07 UTC, NOT 08 (owner 2026-08-06). The KR session ends with the
          # closing auction at 15:30 KST, which is 06:30 UTC. The old boundary kept the KR
          # scalper alive through 07:59 UTC, so it spent roughly NINETY MINUTES after the bell
          # running a loop whose every order the broker rejects -- and, worse, it delayed the
          # US branch by the same ninety minutes. The owner's point: once the closing auction
          # is past, the KR scalper has nothing left to do, so it should stand down and let the
          # US daemon come up EARLY where its behaviour can actually be watched before the
          # 22:30 KST open. Hour granularity makes 07 the first clean cut after the 06:30 close.
          if [ "$HOUR" -ge 22 ] || [ "$HOUR" -le 6 ]; then MARKET=KR
          else MARKET=US; fi
          echo "MARKET=$MARKET" >> "$GITHUB_ENV"
          cd wkaq
          # SCALPER-ONLY RELAY (2026-08-03): wkwave_daemon.py (the accumulation/signal
          # screener) removed from this step per owner directive -- it is no longer in use.
          # LOOP-COUNT / INTERVAL CLI ARGS REMOVED (2026-08-03, owner directive): after two
          # separate incidents caused by this workflow passing wrong --loops/--interval
          # values (a worst-case-sized --loops that created coverage gaps, and an
          # --interval mismatched from the local desktop daemon), the owner ordered the
          # CLI arguments deleted entirely from willkim_realtime_scalper.py and hardcoded
          # as constants (loop forever unless --once, 1.0s tick interval) so a workflow
          # YAML can never again silently override them with a wrong value. This step is
          # updated in the SAME wave as that source change so the two never land out of
          # sync -- passing the now-removed flags would crash with "unrecognized arguments".
          # --execute is required or decide_actions' closeout branch is gated off by
          # cfg.dry_run. --run-id wires the GHA-only baton-touch handoff (GITHUB_ACTIONS-gated
          # in the scalper itself; a local run never passes --run-id and never touches this).
          python scripts/willkim_realtime_scalper.py --market "$MARKET" --run-id "$GITHUB_RUN_ID" --execute || true

      - name: heartbeat
        if: always()
        run: |
          # OPERATOR VISIBILITY (owner 2026-08-06, angry and right). The scalper's stdout is
          # deliberately silent because this repo is PUBLIC and strategy must not leak, but the
          # side effect was that a healthy 28-minute run and a hung one look IDENTICAL in the
          # Actions UI: one echoed command and nothing after. The owner could not check his own
          # service before the bell, which is exactly when checking is worth most. The designed
          # channel for this already exists and had been dead since 2026-08-05 -- LAYER 3 of
          # feedquant-daemon-always-on-strategy specifies wavevault/relay_health.json, and its
          # only writer was removed from this relay when wkwave_daemon.py left. The relay writes
          # it now, so the heartbeat no longer depends on any one script staying in the pipeline.
          # It lands in WkAutoQuant, which is PRIVATE, so it can carry real detail without the
          # public-log constraint that muzzles stdout.
          cd wkaq
          END_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ELAPSED=$(( $(date +%s) - JOB_START ))
          printf '{\n  "last_run": "%s",\n  "market": "%s",\n  "run_id": "%s",\n  "elapsed_sec": %s,\n  "run_step_outcome": "%s",\n  "writer": "maejip_relay"\n}\n' \
            "$END_TS" "${MARKET:-none}" "$GITHUB_RUN_ID" "$ELAPSED" "${JOB_STATUS:-unknown}" > wavevault/relay_health.json
          git config user.name  "WkAutoQuant Bot"
          git config user.email "bot@wkautoquant.local"
          git add wavevault/relay_health.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "heartbeat: relay $MARKET run $GITHUB_RUN_ID [skip ci]"
            git pull --rebase --autostash origin main --quiet 2>/dev/null || true
            git push origin HEAD:main && echo "[heartbeat] pushed" || echo "[heartbeat] push lost the race (non-fatal)"
          fi
          cd ..

      # REMOVED 2026-08-10 (owner instruction) -- "🔑 Save Hantoo token cache", an
      # if: always() step that copied this runner's token back into the upstream
      # repo's shared cache filename and pushed it to main.
      #
      # WHY IT HAD TO GO. This relay authenticates with a DIFFERENT credential than
      # the upstream repo does, but it wrote into the SAME shared filename. The
      # upstream fallback selects the cached token with the newest expiry, and this
      # relay re-issues every ~20min cycle, so its token almost always carried the
      # newest expiry -- meaning the better that fallback worked, the more reliably
      # it picked a token the upstream account could not authenticate with. One
      # measured local run took 222 consecutive EGW00123 rejections with four of
      # five cached files carrying the foreign credential.
      #
      # It was also a failure source in its own right: the fork-bomb incident
      # described just below was triggered by THIS step's commit failing on a merge
      # conflict, an ordinary failure that the (since removed) duplicate self-trigger
      # amplified into six concurrent daemons on one account.
      #
      # The "restore token" step above STAYS. Consuming the upstream daily token is
      # the correct direction and is what stops this relay reissuing every cycle;
      # writing back is what polluted the shared cache. Read-only participation in a
      # shared cache is safe, write participation across credentials is not.

      # REMOVED 2026-08-07 -- "Self-trigger on error (Recurrence Prevention)", an
      # if: failure() step that dispatched a successor with NO baton check. The
      # self-chain below is if: always(), so it ALREADY covers the failure case --
      # and it checks the baton first. Having both meant a failing run fired TWICE,
      # two seconds apart, and each successor that also failed fired twice again.
      # MEASURED 2026-08-07: 2 concurrent runs at 05:11, 2 at 06:03, then SIX inside
      # three minutes, all cancelled by hand. Six daemons is six order streams on ONE
      # account. The trigger was the token-cache commit failing on a relay_health.json
      # merge conflict -- an ordinary failure, amplified into a fork bomb by the
      # unguarded duplicate. OWNER RULING 2026-08-07: on exit, trigger the feed daemon
      # ONLY if the baton is still yours; if it has moved, a daemon is already running.
      # And try exactly ONCE -- no lingering, no retry.
      - name: Unconditional self-chain (GHA cron delivery is best-effort)
        if: always()
        run: |
          # REPLACED 2026-08-03 (was "Conditional self-chain on stale heartbeat"):
          # measured via gh run list that scheduled (event=schedule) runs were
          # arriving 70-80 minutes apart against a */20 cron -- GitHub's own
          # known best-effort delay/drop behavior for schedule triggers under
          # load, not a config bug here. The old step read wavevault/relay_health.json
          # for staleness, but that file has been frozen since wkwave_daemon.py
          # (its only writer) was removed from this relay -- the staleness check
          # was already dead weight. A conditional check ALSO cannot help when
          # cron drops the trigger entirely, because it only runs INSIDE an
          # already-alive job.
          #
          # FIX: every run unconditionally re-seeds the NEXT trigger itself,
          # independent of whether GitHub's own cron actually fires. Safe
          # because baton-touch (_claim_scalper/_active_scalper_run_id in
          # willkim_realtime_scalper.py) already makes an overlapping/redundant
          # run a no-op supersession, never a race.
          #
          # PACING: sleep only long enough to round out a ~20min cadence. During
          # market hours the "run" step above already burns up to 28min (its own
          # internal wall-clock exit), so REMAINING is already negative and this
          # dispatches immediately -- no extra GHA-minute cost. During closed-market
          # hours "run" exits in seconds, so this sleeps out the rest of the 20min
          # window before dispatching, preserving the original cron-like cadence
          # and avoiding a tight self-triggering loop that would burn quota.
          ELAPSED=$(( $(date +%s) - JOB_START ))
          REMAINING=$(( 1200 - ELAPSED ))
          if [ "$REMAINING" -gt 0 ]; then
            echo "elapsed=${ELAPSED}s, sleeping ${REMAINING}s before self-chain"
            sleep "$REMAINING"
          else
            echo "elapsed=${ELAPSED}s already >= 20min, self-chaining immediately"
          fi
          # BATON CHECK (owner ruling 2026-08-03): only self-chain if THIS run still
          # owns the baton for the market it served. If a newer run already superseded
          # it (baton-touch, MAEJIP_ACTIVE_{MARKET}_SCALPER_RUN), that newer run owns
          # its own self-chain -- firing here too would duplicate the chain and drift
          # the cadence for no benefit. Checked HERE, after any sleep, so it reflects
          # the most current state. Skipped entirely if MARKET was never set (should
          # not happen given the HOUR branches above, but fail open -- self-chain
          # rather than silently going quiet on an unexpected code path).
          if [ -n "${MARKET:-}" ]; then
            ACTIVE=$(gh api "repos/kiexpert/WkFeedQuant/actions/variables/MAEJIP_ACTIVE_${MARKET}_SCALPER_RUN" --jq '.value' 2>/dev/null || echo "")
            if [ -n "$ACTIVE" ] && [ "$ACTIVE" != "$GITHUB_RUN_ID" ]; then
              echo "baton for $MARKET now held by run $ACTIVE (not this run $GITHUB_RUN_ID) -- skip self-chain, the new owner chains itself"
              exit 0
            fi
          fi
          gh workflow run maejip_relay.yml --repo kiexpert/WkFeedQuant
